services:
  mongodb:
    image: mongo:6.0
    container_name: easm_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-rootadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword_cuc_kho}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-easm_db}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-easm_db}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-easm_app_user}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-SuperSecretPassword123!}
      MONGO_SEED_DEFAULT_USERS: ${MONGO_SEED_DEFAULT_USERS:-true}
      MONGO_SEED_ADMIN_USERNAME: ${MONGO_SEED_ADMIN_USERNAME:-administrator}
      MONGO_SEED_ADMIN_EMAIL: ${MONGO_SEED_ADMIN_EMAIL:-administrator@example.com}
    volumes:
      - ./mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - easm_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: easm_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - geoip_data:/app/data/geoip:ro
    environment:
      - MONGO_DB_NAME=${MONGO_DB_NAME:-easm_db}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USERNAME=${MONGO_APP_USERNAME:-easm_app_user}
      - MONGO_PASSWORD=${MONGO_APP_PASSWORD:-SuperSecretPassword123!}
      - MONGO_AUTH_SOURCE=${MONGO_DB_NAME:-easm_db}
      - JWT_SECRET=${JWT_SECRET:-change-me-dev-jwt-secret}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-phuocthien7733271@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-smuntzvqfotgaixq}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-phuocthien7733271@gmail.com}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-T&W Falcon}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - MFA_CODE_EXPIRATION_MINUTES=${MFA_CODE_EXPIRATION_MINUTES:-10}
      - MFA_CODE_LENGTH=${MFA_CODE_LENGTH:-6}
      - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    networks:
      - easm_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: easm_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_DEV_PROXY_TARGET=http://backend:8000
      # Quan trọng cho Windows: Ép Vite dùng Polling để nhận diện file thay đổi
      - CHOKIDAR_USEPOLLING=true 
      - WATCHPACK_POLLING=true
    ports:
      - "5173:5173"
    networks:
      - easm_net

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.dev
    container_name: easm_worker
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./worker:/app
      - ./worker/data:/app/data
    environment:
      - MONGO_DB_NAME=${MONGO_DB_NAME:-easm_db}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USERNAME=${MONGO_APP_USERNAME:-easm_app_user}
      - MONGO_PASSWORD=${MONGO_APP_PASSWORD:-SuperSecretPassword123!}
      - MONGO_AUTH_SOURCE=${MONGO_DB_NAME:-easm_db}
    depends_on:
      - mongodb
    networks:
      - easm_net

  geoip_updater:
    build:
      context: .
      dockerfile: geoip-updater.Dockerfile
    container_name: easm_geoip_updater
    restart: unless-stopped
    environment:
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      GEOIP_UPDATE_CRON: "0 3 * * 4"
      GEOIP_DIR: /geoip
    volumes:
      - geoip_data:/geoip
    networks:
      - easm_net

volumes:
  geoip_data:

networks:
  easm_net:
    driver: bridge
