services:
  mongodb:
    image: mongo:6.0
    container_name: easm_mongodb_prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo_prod_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - easm_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easm_backend_prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_AUTH_SOURCE: ${MONGO_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      MFA_CODE_EXPIRATION_MINUTES: ${MFA_CODE_EXPIRATION_MINUTES}
      MFA_CODE_LENGTH: ${MFA_CODE_LENGTH}
    depends_on:
      - mongodb
    networks:
      - easm_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: easm_frontend_prod
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - easm_net

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: easm_worker_prod
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env.production
    environment:
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_AUTH_SOURCE: ${MONGO_DB_NAME}
    volumes:
      - ./worker/data:/app/data
    depends_on:
      - mongodb
    networks:
      - easm_net

  caddy:
    image: caddy:2.8-alpine
    container_name: easm_caddy_prod
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - easm_net

volumes:
  mongo_prod_data:
  caddy_data:
  caddy_config:

networks:
  easm_net:
    driver: bridge
